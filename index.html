<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coordinate Atelier</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Reggio Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        /* --- Reggio "Lumi" Theme Variables & Base Styles --- */
        :root {
            --bg-paper: #FDFBF7;
            --color-sage: #7C9082;
            --color-sage-light: #E8EDE9;
            --color-clay: #D4A373;
            --color-stone: #4A4A4A;
            --color-pebble: #A8B5BA;
            --shadow-soft: 0 8px 24px rgba(124, 144, 130, 0.12);
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--bg-paper);
            color: var(--color-stone);
            /* Reggio Dot Pattern Background */
            background-image: radial-gradient(var(--color-sage) 1px, transparent 1px);
            background-size: 40px 40px;
            touch-action: pan-y; /* Prevent scroll on touch interactions inside canvas */
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
        }

        /* Custom Scrollbar for nicer feel */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--color-pebble);
            border-radius: 4px;
        }

        /* Utility classes for dynamic usage in React if needed */
        .text-sage { color: var(--color-sage); }
        .text-clay { color: var(--color-clay); }
        .bg-sage { background-color: var(--color-sage); }
        .bg-paper { background-color: var(--bg-paper); }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: {
                            DEFAULT: '#7C9082',
                            light: '#E8EDE9',
                            dark: '#6A7F70'
                        },
                        clay: {
                            DEFAULT: '#D4A373',
                            light: '#F5E6D8'
                        },
                        stone: '#4A4A4A',
                        pebble: '#A8B5BA',
                        paper: '#FDFBF7'
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Lato', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 8px 24px rgba(124, 144, 130, 0.12)',
                        'card': '0 20px 60px rgba(0,0,0,0.05)',
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex items-center justify-center p-2 md:p-4">
    <div id="root" class="w-full max-w-6xl"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- Icons (Inline SVGs) ---
        const Trophy = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        );
        const RefreshCw = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        );
        const Check = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"/></svg>
        );
        const X = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 18 18"/></svg>
        );
        const Target = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        );
        const Info = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        );
        const GridIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>
        );
        const Maximize = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        );
        const Polygon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 2l8.5 5-3.5 10h-10L3.5 7z"/></svg>
        );

        // --- Main Component ---
        const CoordinateGame = () => {
            const [mode, setMode] = useState('point'); // 'point' | 'line' | 'shape'
            const [quadrantMode, setQuadrantMode] = useState('1'); // '1' (Positive only) or '4' (All quadrants)
            
            const [targets, setTargets] = useState([{ x: 0, y: 0 }]); // Array of points to find
            const [foundPoints, setFoundPoints] = useState([]); // Points correctly found this round
            
            const [score, setScore] = useState(0);
            const [streak, setStreak] = useState(0);
            const [feedback, setFeedback] = useState(null); // 'correct', 'incorrect', 'partial', or null
            const [clickedPoint, setClickedPoint] = useState(null); // Last clicked point (for error display)
            const [gridSize, setGridSize] = useState(10); 
            const [showConfetti, setShowConfetti] = useState(false);

            const canvasRef = useRef(null);

            // Layout constants
            const PADDING = 40;
            const CANVAS_SIZE = 800; // Internal resolution

            // Calculate range based on settings
            const getRange = useCallback(() => {
                if (quadrantMode === '1') {
                return { min: 0, max: gridSize };
                } else {
                return { min: -gridSize, max: gridSize };
                }
            }, [quadrantMode, gridSize]);

            // --- Shape Generators ---
            // Returns an array of points for a shape centered roughly at (cx, cy)
            const generateShape = (cx, cy, type) => {
                const points = [];
                // Scale factor for shapes based on grid size (keep them visible but fitting)
                const s = Math.max(2, Math.floor(gridSize / 4)); 

                switch (type) {
                    case 'square':
                        points.push({ x: cx - s, y: cy - s });
                        points.push({ x: cx + s, y: cy - s });
                        points.push({ x: cx + s, y: cy + s });
                        points.push({ x: cx - s, y: cy + s });
                        break;
                    case 'rectangle':
                        const w = s + 1;
                        const h = s - 1;
                        points.push({ x: cx - w, y: cy - h });
                        points.push({ x: cx + w, y: cy - h });
                        points.push({ x: cx + w, y: cy + h });
                        points.push({ x: cx - w, y: cy + h });
                        break;
                    case 'triangle': // Isosceles
                        points.push({ x: cx, y: cy + s }); // Top
                        points.push({ x: cx + s, y: cy - s }); // Bottom Right
                        points.push({ x: cx - s, y: cy - s }); // Bottom Left
                        break;
                    case 'diamond':
                        points.push({ x: cx, y: cy + s });
                        points.push({ x: cx + s, y: cy });
                        points.push({ x: cx, y: cy - s });
                        points.push({ x: cx - s, y: cy });
                        break;
                    default:
                        break;
                }
                return points;
            };

            // Generate new challenge
            const generateNewTarget = useCallback(() => {
                setFeedback(null);
                setClickedPoint(null);
                setShowConfetti(false);
                setFoundPoints([]);

                const { min, max } = getRange();
                
                // Helper to get random coord within margins
                // We add margin so shapes don't spawn half off-screen
                const getSafeCoord = (margin = 0) => {
                    const safeMin = min + margin;
                    const safeMax = max - margin;
                    return Math.floor(Math.random() * (safeMax - safeMin + 1)) + safeMin;
                };

                if (mode === 'point') {
                    setTargets([{ x: getSafeCoord(), y: getSafeCoord() }]);
                } else if (mode === 'line') {
                    const p1 = { x: getSafeCoord(), y: getSafeCoord() };
                    let p2 = { x: getSafeCoord(), y: getSafeCoord() };
                    while (p1.x === p2.x && p1.y === p2.y) p2 = { x: getSafeCoord(), y: getSafeCoord() };
                    setTargets([p1, p2]);
                } else if (mode === 'shape') {
                    const shapeTypes = ['square', 'rectangle', 'triangle', 'diamond'];
                    const type = shapeTypes[Math.floor(Math.random() * shapeTypes.length)];
                    
                    // Try to find a valid placement
                    let validPoints = null;
                    let attempts = 0;
                    
                    while (!validPoints && attempts < 20) {
                        const margin = Math.ceil(gridSize / 3);
                        const cx = getSafeCoord(margin);
                        const cy = getSafeCoord(margin);
                        const candidatePoints = generateShape(cx, cy, type);
                        
                        // Check bounds
                        const isOutOfBounds = candidatePoints.some(p => p.x < min || p.x > max || p.y < min || p.y > max);
                        if (!isOutOfBounds) {
                            validPoints = candidatePoints;
                        }
                        attempts++;
                    }
                    
                    // Fallback to simple points if shape generation fails (rare)
                    setTargets(validPoints || [{ x: 1, y: 1 }, { x: 2, y: 2 }, { x: 1, y: 2 }]);
                }

            }, [getRange, mode, gridSize]);

            // Initial load & Mode change triggers
            useEffect(() => {
                generateNewTarget();
            }, [generateNewTarget]);

            // Handle Canvas Drawing
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                // Colors from theme
                const COLOR_AXIS = '#4A4A4A'; // Stone
                const COLOR_GRID = '#E8EDE9'; // Sage Light
                const COLOR_SUCCESS = '#7C9082'; // Sage
                const COLOR_ERROR = '#D4A373'; // Clay
                
                // Clear canvas
                ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                
                const { min, max } = getRange();
                const totalUnits = max - min;
                
                const graphWidth = CANVAS_SIZE - (PADDING * 2);
                const spacing = graphWidth / totalUnits;

                const toPixelX = (x) => PADDING + ((x - min) * spacing);
                const toPixelY = (y) => (CANVAS_SIZE - PADDING) - ((y - min) * spacing);

                // --- Draw Grid ---
                ctx.font = '14px Lato';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                for (let i = min; i <= max; i++) {
                    const isAxis = i === 0;
                    
                    // Vertical lines
                    const xPixel = toPixelX(i);
                    ctx.beginPath();
                    ctx.strokeStyle = isAxis ? COLOR_AXIS : COLOR_GRID;
                    ctx.lineWidth = isAxis ? 3 : 1;
                    ctx.moveTo(xPixel, PADDING);
                    ctx.lineTo(xPixel, CANVAS_SIZE - PADDING);
                    ctx.stroke();

                    // X Labels
                    const shouldShowLabel = Math.abs(i) % (gridSize >= 20 && quadrantMode === '4' ? 5 : 1) === 0;
                    
                    if (shouldShowLabel) {
                        ctx.fillStyle = isAxis ? COLOR_AXIS : '#A8B5BA';
                        ctx.font = isAxis ? 'bold 14px Lato' : '14px Lato';
                        if (!(i === 0 && quadrantMode === '4')) {
                            ctx.fillText(i.toString(), xPixel, CANVAS_SIZE - PADDING + 25);
                        }
                    }

                    // Horizontal lines
                    const yPixel = toPixelY(i);
                    ctx.beginPath();
                    ctx.strokeStyle = isAxis ? COLOR_AXIS : COLOR_GRID;
                    ctx.lineWidth = isAxis ? 3 : 1;
                    ctx.moveTo(PADDING, yPixel);
                    ctx.lineTo(CANVAS_SIZE - PADDING, yPixel);
                    ctx.stroke();

                    // Y Labels
                    if (shouldShowLabel) {
                        ctx.fillStyle = isAxis ? COLOR_AXIS : '#A8B5BA';
                        ctx.font = isAxis ? 'bold 14px Lato' : '14px Lato';
                        if (!(i === 0 && quadrantMode === '4')) {
                            ctx.fillText(i.toString(), PADDING - 25, yPixel);
                        }
                    }
                }
                
                // Draw "0" explicitly
                if (quadrantMode === '4') {
                    const originX = toPixelX(0);
                    const originY = toPixelY(0);
                    ctx.fillStyle = COLOR_AXIS;
                    ctx.font = 'bold 14px Lato';
                    ctx.fillText("0", originX - 15, originY + 15);
                }

                // Axis Arrows/Titles
                ctx.save();
                ctx.font = 'bold 18px Playfair Display';
                ctx.fillStyle = COLOR_AXIS;
                ctx.fillText('x', CANVAS_SIZE - 15, toPixelY(0) - 15);
                ctx.fillText('y', toPixelX(0) + 20, PADDING - 10);
                ctx.restore();

                // --- Draw Game Elements ---

                // 1. Found Points
                foundPoints.forEach(p => {
                    const px = toPixelX(p.x);
                    const py = toPixelY(p.y);
                    ctx.beginPath();
                    ctx.arc(px, py, 10, 0, 2 * Math.PI);
                    ctx.fillStyle = COLOR_SUCCESS;
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    
                    // Label
                    ctx.fillStyle = COLOR_SUCCESS;
                    ctx.font = 'bold 16px Lato';
                    ctx.fillText(`(${p.x}, ${p.y})`, px, py - 25);
                });

                // 2. Lines / Shapes
                if (mode === 'line' && foundPoints.length === 2) {
                    const p1 = foundPoints[0];
                    const p2 = foundPoints[1];
                    ctx.beginPath();
                    ctx.moveTo(toPixelX(p1.x), toPixelY(p1.y));
                    ctx.lineTo(toPixelX(p2.x), toPixelY(p2.y));
                    ctx.strokeStyle = COLOR_SUCCESS;
                    ctx.lineWidth = 5;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                } 
                else if (mode === 'shape' && feedback === 'correct') {
                    // Draw completed filled shape
                    ctx.beginPath();
                    const pStart = targets[0];
                    ctx.moveTo(toPixelX(pStart.x), toPixelY(pStart.y));
                    for (let i = 1; i < targets.length; i++) {
                        ctx.lineTo(toPixelX(targets[i].x), toPixelY(targets[i].y));
                    }
                    ctx.closePath();
                    
                    // Fill style
                    ctx.fillStyle = 'rgba(124, 144, 130, 0.2)'; // Sage with opacity
                    ctx.fill();
                    
                    ctx.strokeStyle = COLOR_SUCCESS;
                    ctx.lineWidth = 5;
                    ctx.lineJoin = 'round';
                    ctx.stroke();
                }

                // 3. Wrong Click
                if (clickedPoint && feedback === 'incorrect') {
                    const px = toPixelX(clickedPoint.x);
                    const py = toPixelY(clickedPoint.y);
                    ctx.beginPath();
                    ctx.arc(px, py, 10, 0, 2 * Math.PI);
                    ctx.fillStyle = COLOR_ERROR;
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    
                    ctx.fillStyle = COLOR_ERROR;
                    ctx.font = 'bold 16px Lato';
                    ctx.fillText(`(${clickedPoint.x}, ${clickedPoint.y})`, px, py - 25);
                }
                
                // 4. Confetti
                if (showConfetti) {
                    const confettiColors = [COLOR_SUCCESS, COLOR_ERROR, '#A8B5BA', '#4A4A4A'];
                    for(let k=0; k<50; k++) {
                        const cx = Math.random() * CANVAS_SIZE;
                        const cy = Math.random() * CANVAS_SIZE;
                        const r = Math.random() * 6 + 3;
                        ctx.beginPath();
                        ctx.arc(cx, cy, r, 0, Math.PI * 2);
                        ctx.fillStyle = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                        ctx.globalAlpha = 0.6;
                        ctx.fill();
                        ctx.globalAlpha = 1.0;
                    }
                }

            }, [targets, foundPoints, clickedPoint, feedback, gridSize, showConfetti, mode, quadrantMode, getRange]);

            // Handle Click
            const handleCanvasClick = (e) => {
                if (feedback === 'correct') return;
                e.preventDefault();

                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                
                const scaleX = CANVAS_SIZE / rect.width;
                const scaleY = CANVAS_SIZE / rect.height;
                
                const clickX = (e.clientX - rect.left) * scaleX;
                const clickY = (e.clientY - rect.top) * scaleY;

                const { min, max } = getRange();
                const totalUnits = max - min;
                const graphWidth = CANVAS_SIZE - (PADDING * 2);
                const spacing = graphWidth / totalUnits;

                let gridX = Math.round(((clickX - PADDING) / spacing) + min);
                let gridY = Math.round((((CANVAS_SIZE - PADDING) - clickY) / spacing) + min);

                gridX = Math.max(min, Math.min(max, gridX));
                gridY = Math.max(min, Math.min(max, gridY));

                // If already found, ignore
                if (foundPoints.some(p => p.x === gridX && p.y === gridY)) return; 

                setClickedPoint({ x: gridX, y: gridY });

                // Check if this point is in the target list
                const isTarget = targets.some(t => t.x === gridX && t.y === gridY);

                if (isTarget) {
                    handleHit(gridX, gridY);
                } else {
                    handleMiss();
                }
            };

            const handleHit = (x, y) => {
                const newFound = [...foundPoints, {x, y}];
                setFoundPoints(newFound);

                if (newFound.length === targets.length) {
                    setFeedback('correct');
                    setScore(s => s + (mode === 'shape' ? 50 : mode === 'line' ? 20 : 10));
                    setStreak(s => s + 1);
                    setShowConfetti(true);
                    setTimeout(() => generateNewTarget(), 2500); // Longer delay to admire the shape
                } else {
                    setFeedback('partial');
                }
            };

            const handleMiss = () => {
                setFeedback('incorrect');
                setStreak(0);
            };

            // Button Base Class
            const btnBase = "flex items-center gap-2 px-3 py-1.5 md:px-4 md:py-2 rounded-full font-bold text-sm transition-all border shadow-sm w-full justify-center md:justify-start";
            const btnActive = "bg-sage text-white border-sage shadow-md";
            const btnInactive = "bg-white text-stone border-gray-200 hover:border-sage hover:text-sage";

            return (
                <div className="bg-white/80 backdrop-blur-sm p-4 md:p-6 lg:p-8 rounded-3xl shadow-soft border border-black/5 w-full flex flex-col md:flex-row gap-6 md:gap-8 items-stretch md:items-start min-h-[500px]">
                
                    {/* Left Sidebar: Controls */}
                    <div className="flex-1 flex flex-col gap-4 md:gap-6 min-w-[240px]">
                        
                        {/* Header Section */}
                        <div>
                            <h1 className="text-2xl md:text-3xl font-serif font-bold text-stone flex items-center gap-2">
                                <span className="p-2 bg-sage/10 rounded-xl text-sage">
                                    <Target className="w-6 h-6" />
                                </span>
                                Coordinate Atelier
                            </h1>
                            <p className="text-pebble text-sm mt-1 ml-1">An inquiry into points, lines & shapes</p>
                        </div>

                        {/* Scoreboard */}
                        <div className="flex gap-4">
                            <div className="flex-1 bg-white px-4 py-3 rounded-2xl border border-gray-100 shadow-sm text-center">
                                <div className="text-[10px] uppercase tracking-widest text-pebble font-bold">Streak</div>
                                <div className="text-xl font-bold text-clay flex items-center justify-center gap-1">
                                    <Trophy className="w-4 h-4" /> {streak}
                                </div>
                            </div>
                            <div className="flex-1 bg-white px-4 py-3 rounded-2xl border border-gray-100 shadow-sm text-center">
                                <div className="text-[10px] uppercase tracking-widest text-pebble font-bold">Score</div>
                                <div className="text-xl font-bold text-stone">{score}</div>
                            </div>
                        </div>

                        <div className="hidden md:block border-t border-gray-100 my-1"></div>

                        {/* Mode Controls */}
                        <div className="space-y-3">
                            <div className="text-xs uppercase tracking-widest text-pebble font-bold ml-1">Challenge Type</div>
                            <div className="flex bg-sage-light/50 p-1.5 rounded-2xl">
                                <button 
                                    onClick={() => { setMode('point'); generateNewTarget(); }}
                                    className={`flex-1 px-2 py-2 rounded-xl text-xs md:text-sm font-bold transition-all ${mode === 'point' ? 'bg-white text-sage shadow-sm' : 'text-pebble hover:text-stone'}`}
                                >
                                    Points
                                </button>
                                <button 
                                    onClick={() => { setMode('line'); generateNewTarget(); }}
                                    className={`flex-1 px-2 py-2 rounded-xl text-xs md:text-sm font-bold transition-all ${mode === 'line' ? 'bg-white text-sage shadow-sm' : 'text-pebble hover:text-stone'}`}
                                >
                                    Lines
                                </button>
                                <button 
                                    onClick={() => { setMode('shape'); generateNewTarget(); }}
                                    className={`flex-1 px-2 py-2 rounded-xl text-xs md:text-sm font-bold transition-all ${mode === 'shape' ? 'bg-white text-sage shadow-sm' : 'text-pebble hover:text-stone'}`}
                                >
                                    Shapes
                                </button>
                            </div>
                        </div>

                        {/* Grid Controls */}
                        <div className="space-y-3">
                            <div className="text-xs uppercase tracking-widest text-pebble font-bold ml-1">Grid System</div>
                            <div className="flex flex-col gap-2">
                                <button 
                                    onClick={() => { setQuadrantMode('1'); generateNewTarget(); }}
                                    className={`${btnBase} ${quadrantMode === '1' ? btnActive : btnInactive}`}
                                >
                                    <GridIcon className="w-4 h-4" /> Positive Only (Q1)
                                </button>
                                <button 
                                    onClick={() => { setQuadrantMode('4'); generateNewTarget(); }}
                                    className={`${btnBase} ${quadrantMode === '4' ? btnActive : btnInactive}`}
                                >
                                    <Maximize className="w-4 h-4" /> Full Grid (4 Quadrants)
                                </button>
                            </div>
                        </div>

                        {/* Size Controls */}
                         <div className="space-y-3">
                            <div className="text-xs uppercase tracking-widest text-pebble font-bold ml-1">Grid Scale</div>
                             <div className="flex gap-2">
                                {[5, 10, 20].map(size => (
                                    <button 
                                        key={size}
                                        onClick={() => setGridSize(size)}
                                        className={`flex-1 py-2 rounded-xl text-xs font-bold border transition-colors
                                            ${gridSize === size ? 'bg-stone text-white border-stone' : 'bg-white text-pebble border-gray-200 hover:border-stone'}
                                        `}
                                    >
                                        {size}x{size}
                                    </button>
                                ))}
                             </div>
                        </div>

                         <div className="flex-1 hidden md:block"></div>
                         
                         <button 
                            onClick={generateNewTarget}
                            className="w-full text-stone hover:text-sage font-bold text-sm flex items-center justify-center gap-2 px-4 py-3 rounded-2xl bg-gray-50 hover:bg-sage-light/50 transition-colors border border-transparent hover:border-sage-light"
                         >
                            <RefreshCw className="w-4 h-4" /> Skip Challenge
                         </button>
                    </div>

                    {/* Right Area: Workspace (Canvas) */}
                    <div className="flex-[2] flex flex-col items-center justify-start relative w-full min-h-[300px]">
                        
                        {/* Prompt / Feedback Banner */}
                        <div className={`
                            w-full mb-4
                            bg-white shadow-soft border border-gray-100
                            px-6 py-4 rounded-2xl flex flex-col items-center justify-center
                            transition-all duration-300 transform
                            ${feedback ? 'ring-2 ring-sage/20' : ''}
                        `}>
                            <div className="text-pebble text-xs font-bold uppercase tracking-widest mb-1">
                                {mode === 'point' ? 'Locate' : mode === 'line' ? 'Connect' : 'Construct Shape'}
                            </div>
                            
                            <div className="text-3xl font-serif font-bold text-stone flex gap-3 items-center flex-wrap justify-center">
                                {targets.map((t, i) => {
                                    const isFound = foundPoints.some(p => p.x === t.x && p.y === t.y);
                                    return (
                                        <div key={i} className={`flex items-center ${isFound ? 'text-sage opacity-50' : 'text-stone'}`}>
                                            <span>({t.x}, {t.y})</span>
                                            {i < targets.length - 1 && <span className="text-pebble font-light mx-2 text-xl">&</span>}
                                        </div>
                                    )
                                })}
                            </div>

                            {/* Status Text */}
                            <div className="mt-2 text-sm font-bold h-5">
                                {feedback === 'correct' && <span className="text-sage flex items-center gap-1"><Check className="w-4 h-4"/> Beautiful!</span>}
                                {feedback === 'incorrect' && <span className="text-clay flex items-center gap-1"><X className="w-4 h-4"/> Not quite ({clickedPoint?.x}, {clickedPoint?.y})</span>}
                                {feedback === 'partial' && <span className="text-sage flex items-center gap-1">Continue...</span>}
                                {!feedback && <span className="text-pebble font-normal">Tap the intersections</span>}
                            </div>
                        </div>

                        {/* Canvas Container */}
                        <div className="w-full h-full flex items-center justify-center min-h-[300px] flex-1">
                            <canvas
                                ref={canvasRef}
                                width={800}
                                height={800}
                                onClick={handleCanvasClick}
                                className="max-w-full max-h-[60vh] md:max-h-[75vh] aspect-square bg-white rounded-3xl shadow-inner border border-black/5 touch-none cursor-crosshair"
                                style={{ touchAction: 'none' }}
                            />
                        </div>
                        
                        <div className="mt-2 text-xs text-pebble text-center hidden md:block">
                            Horizontal axis: <span className="font-bold">x</span> &bull; Vertical axis: <span className="font-bold">y</span>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CoordinateGame />);
    </script>
</body>
</html>
